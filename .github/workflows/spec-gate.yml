name: spec-gate

on:
  push:
    branches: [ main ]
    paths: [ 'architecture/specs/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'architecture/specs/**' ]

permissions:
  contents: read

jobs:
  validate-specs:
    name: validate-specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files present
        run: |
          FAIL=0
          for f in \
            architecture/specs/spec_001_umbrella.md \
            architecture/specs/spec_001_a_compliance.md \
            architecture/specs/spec_001_b_data_integrity.md \
            architecture/specs/spec_001_c_automation_bridge.md \
            architecture/specs/build_sheet_spec_001_d.md; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Canonical section order
        run: |
          FAIL=0
          SECTIONS=("Background" "Requirements" "Method" "Implementation" "Milestones" "Gathering Results")
          for spec in architecture/specs/spec_001*.md; do
            echo ">>> $spec"
            last=-1
            for s in "${SECTIONS[@]}"; do
              pos=$(grep -n "^## ${s}" "$spec" 2>/dev/null | head -1 | cut -d: -f1 || true)
              [ -z "$pos" ] && continue
              if [ "$pos" -le "$last" ]; then
                echo "  OUT OF ORDER: $s (line $pos, last was $last)"
                FAIL=1
              else
                echo "  OK: $s (line $pos)"
                last=$pos
              fi
            done
          done
          exit $FAIL

      - name: Won't list present
        run: |
          FAIL=0
          for spec in architecture/specs/spec_001*.md; do
            if grep -q "Won't\|Will not" "$spec"; then
              echo "OK: $(basename $spec)"
            else
              echo "MISSING Won't list: $(basename $spec)"
              FAIL=1
            fi
          done
          exit $FAIL

  regrade-reminder:
    name: Re-grade reminder
    runs-on: ubuntu-latest
    needs: validate-specs
    if: github.event_name == 'push'
    steps:
      - name: Post reminder
        run: |
          echo "## Specs changed — re-grade recommended" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more files under \`architecture/specs/\` changed on push to \`main\`." >> $GITHUB_STEP_SUMMARY
          echo "Paste the following into Claude Code to re-run the grading pipeline:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'Execute PLAN.md. SPECS_DIR is C:\Users\benoi\dev\town-kb\architecture\specs' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
